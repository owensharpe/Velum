# system
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# project info
[project]
name = "velum"
version = "0.1.0"
description = "A unified machine learning library combining classical methods and deep learning architectures under a consistent API. Built on PyTorch and scikit-learn."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

# package dependencies
dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
    "torch>=2.0",
    "scikit-learn>=1.0",
    "matplotlib",
    "seaborn",
    "plotly",
    "tqdm"
]

# dev dependencies
[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff"
]

# explicit package discovery — only build velum, not api
[tool.setuptools.packages.find]
include = ["velum*"]

# tool configurations
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
